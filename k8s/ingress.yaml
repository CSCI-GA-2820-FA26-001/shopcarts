apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shopcarts
  labels:
    app: shopcarts
    app.kubernetes.io/part-of: shopcarts
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shopcarts
                port:
                  name: http
