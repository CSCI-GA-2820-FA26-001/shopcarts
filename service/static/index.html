<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shopcarts Admin</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
  </head>
  <body>
    <div class="container py-4">
      <header class="mb-4">
        <h1>Shopcarts Admin</h1>
        <p class="text-body-secondary">Create, find, change and check out customer shopcarts.</p>
      </header>

      <!-- Flash Message -->
      <div class="alert alert-secondary" role="status">
        <strong>Status:</strong> <span id="flash_message"></span>
      </div>

      <!-- Shopcart Form -->
      <form id="shopcart_form" class="card card-body mb-4" autocomplete="off" onsubmit="return false;">
        <div class="row g-3 align-items-end">
          <div class="col-sm-6 col-lg-4">
            <label for="shopcart_id" class="form-label">Shopcart ID</label>
            <input type="text" class="form-control" id="shopcart_id" placeholder="Enter the ID of a shopcart">
          </div>
          <div class="col-sm-6 col-lg-8">
            <button type="button" class="btn btn-primary" id="retrieve-btn">Retrieve</button>
            <button type="button" class="btn btn-danger" id="delete-btn">Delete</button>
          </div>

          <div class="col-sm-6 col-lg-4">
            <label for="shopcart_user_id" class="form-label">User ID</label>
            <input type="text" class="form-control" id="shopcart_user_id" inputmode="numeric" placeholder="Enter the ID of a customer">
          </div>
          <div class="col-sm-6 col-lg-4">
            <label for="shopcart_status" class="form-label">Status</label>
            <input type="text" class="form-control bg-body-tertiary" id="shopcart_status" readonly tabindex="-1">
          </div>
        </div>

        <div class="d-flex flex-wrap gap-2 mt-4">
          <button type="button" class="btn btn-primary" id="search-btn">Search</button>
          <button type="button" class="btn btn-secondary" id="clear-btn">Clear</button>
          <button type="button" class="btn btn-success" id="create-btn">Create</button>
          <button type="button" class="btn btn-warning" id="update-btn">Update</button>
          <button type="button" class="btn btn-info" id="list-btn">List All</button>
          <button type="button" class="btn btn-dark" id="checkout-btn">Checkout</button>
        </div>
      </form>

      <!-- Search Results -->
      <h2 class="h4">Results</h2>
      <div class="table-responsive">
        <table class="table table-striped table-hover" id="search_results">
          <thead>
            <tr>
              <th scope="col">Shopcart ID</th>
              <th scope="col">User ID</th>
              <th scope="col">Status</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <script src="/static/js/jquery-3.7.1.min.js"></script>
    <script src="/static/js/rest_api.js"></script>
  </body>
</html>
