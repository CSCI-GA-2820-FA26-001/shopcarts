# Custom tasks for cd-pipeline that aren't on Tekton Hub.
# Each task story adds its own task here, separated by "---".
---
# Clones a Git repository into a workspace (#61). It is a small equivalent of
# git-clone from Tekton Hub and uses the same names for what it has. It doesn't
# set a user ID, so that OpenShift can choose the one it runs as.
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: clone-source
spec:
  description: Clones a Git repository into the root of the output workspace
  params:
    - name: url
      description: The URL of the Git repository to clone
      type: string
    - name: revision
      description: The branch, tag or full commit SHA to check out
      type: string
  workspaces:
    - name: output
      description: The workspace to clone into; init must have emptied it
  results:
    - name: commit
      description: The SHA of the commit that was checked out
    - name: url
      description: The URL that was cloned
  steps:
    - name: clone
      image: ghcr.io/tektoncd-catalog/git-clone:v1.1.0
      workingDir: $(workspaces.output.path)
      env:
        # Passed as variables so that their values are never run as shell code
        - name: URL
          value: $(params.url)
        - name: REVISION
          value: $(params.revision)
        # Fail instead of asking for a password if the repository isn't public
        - name: GIT_TERMINAL_PROMPT
          value: "0"
        # The volume may belong to another user than the one this runs as
        - name: GIT_CONFIG_COUNT
          value: "1"
        - name: GIT_CONFIG_KEY_0
          value: safe.directory
        - name: GIT_CONFIG_VALUE_0
          value: $(workspaces.output.path)
      script: |
        #!/bin/sh
        set -eu
        # Let the later tasks, which may run as other users, change the files
        umask 002
        if [ -z "$URL" ] || [ -z "$REVISION" ]; then
          echo "Both the repository URL and the revision are required" >&2
          exit 1
        fi
        git init --quiet .
        git remote add -- origin "$URL"
        git fetch --depth 1 --no-tags -- origin "$REVISION"
        git checkout --quiet --detach FETCH_HEAD
        COMMIT="$(git rev-parse HEAD)"
        printf "%s" "$COMMIT" > "$(results.commit.path)"
        printf "%s" "$URL" > "$(results.url.path)"
        echo "Checked out $REVISION at $COMMIT"
        ls -la
---
# Runs Flake8 and Pylint on the cloned source code (#62). The workspace is
# read-only, so it can run in parallel with the unit tests (#58).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: lint
spec:
  description: Runs make lint and fails if it finds any problem
  workspaces:
    - name: source
      description: The workspace with the cloned source code at its root
      readOnly: true
  steps:
    - name: lint
      image: quay.io/rofrano/pipeline-selenium:sp26
      workingDir: $(workspaces.source.path)
      env:
        # Keep every file that the tools write out of the workspace
        - name: HOME
          value: /tmp/lint
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: PIPENV_DONT_LOAD_ENV
          value: "1"
        - name: PIPENV_NOSPIN
          value: "1"
        # Hide the notice that Pipenv uses the virtual environment below
        - name: PIPENV_VERBOSITY
          value: "-1"
      script: |
        #!/bin/sh
        set -eu
        python3 -m venv "$HOME/venv"
        . "$HOME/venv/bin/activate"
        # --deploy fails if Pipfile.lock is out of date, and never changes it
        pipenv install --dev --deploy
        make lint
---
# Runs the unit tests on the cloned source code against a Postgres sidecar
# (#58). It fails if a test fails or if the coverage is below 95%, the same as
# CI. The workspace is read-only, so it can run in parallel with lint (#62).
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: tests
spec:
  description: Runs make test against a Postgres sidecar and fails on any failed test or low coverage
  workspaces:
    - name: source
      description: The workspace with the cloned source code at its root
      readOnly: true
  sidecars:
    # The same database as CI. The sidecar shares the pod's network with the
    # step, so the tests reach it on localhost.
    - name: postgres
      image: postgres:15-alpine
      env:
        - name: POSTGRES_PASSWORD
          value: postgres
        - name: POSTGRES_DB
          value: testdb
        # Keep the data out of the image's volume, which may not be writable
        # by the random user that OpenShift picks
        - name: PGDATA
          value: /tmp/pgdata
      readinessProbe:
        exec:
          command:
            - pg_isready
            - -h
            - 127.0.0.1
            - -U
            - postgres
            - -d
            - testdb
        periodSeconds: 2
        timeoutSeconds: 3
  steps:
    - name: pytest
      image: quay.io/rofrano/pipeline-selenium:sp26
      workingDir: $(workspaces.source.path)
      env:
        - name: DATABASE_URI
          value: postgresql+psycopg://postgres:postgres@localhost:5432/testdb
        # Keep every file that the tools write out of the workspace
        - name: HOME
          value: /tmp/tests
        - name: PYTHONDONTWRITEBYTECODE
          value: "1"
        - name: COVERAGE_FILE
          value: /tmp/tests/.coverage
        - name: PYTEST_ADDOPTS
          value: -p no:cacheprovider
        - name: PIPENV_DONT_LOAD_ENV
          value: "1"
        - name: PIPENV_NOSPIN
          value: "1"
        - name: PIPENV_VERBOSITY
          value: "-1"
      script: |
        #!/bin/sh
        set -eu
        python3 -m venv "$HOME/venv"
        . "$HOME/venv/bin/activate"
        # --deploy fails if Pipfile.lock is out of date, and never changes it
        pipenv install --dev --deploy
        # Tekton starts the step once the sidecar is ready, but wait for the
        # database anyway, because the tests fail on the first refused connection
        python3 - <<'PY'
        import os, sys, time
        import psycopg
        url = os.environ["DATABASE_URI"].replace("postgresql+psycopg://", "postgresql://")
        for _ in range(30):
            try:
                psycopg.connect(url).close()
                print("Postgres is ready")
                sys.exit(0)
            except psycopg.OperationalError:
                time.sleep(2)
        sys.exit("Postgres did not start within 60 seconds")
        PY
        # Same command as CI: any failed test or coverage below 95% fails the task
        make test
