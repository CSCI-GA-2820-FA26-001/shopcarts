# The public HTTPS URL that GitHub sends the webhook to (#76).
# Tekton creates the el-cd-listener Service for the cd-listener EventListener.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: el-cd-listener
  labels:
    app.kubernetes.io/part-of: shopcarts
spec:
  to:
    kind: Service
    name: el-cd-listener
  port:
    targetPort: http-listener
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
