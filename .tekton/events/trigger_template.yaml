# Creates a run of cd-pipeline on the shared pipeline-pvc workspace (#76)
apiVersion: triggers.tekton.dev/v1beta1
kind: TriggerTemplate
metadata:
  name: cd-template
spec:
  params:
    - name: git-repo-url
      description: The URL of the repository that was pushed to
    - name: git-revision
      description: The SHA of the commit that was pushed
    - name: image-name
      description: The full name of the image to build and deploy
    - name: base-url
      description: The Route URL of the service, for the BDD tests
  resourcetemplates:
    - apiVersion: tekton.dev/v1
      kind: PipelineRun
      metadata:
        generateName: cd-pipeline-run-
        labels:
          app.kubernetes.io/part-of: shopcarts
      spec:
        pipelineRef:
          name: cd-pipeline
        taskRunTemplate:
          serviceAccountName: pipeline
        params:
          - name: GIT_REPO
            value: $(tt.params.git-repo-url)
          - name: GIT_REF
            value: $(tt.params.git-revision)
          - name: IMAGE_NAME
            value: $(tt.params.image-name)
          - name: BASE_URL
            value: $(tt.params.base-url)
        workspaces:
          - name: pipeline-workspace
            persistentVolumeClaim:
              claimName: pipeline-pvc
